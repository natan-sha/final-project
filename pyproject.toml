[project]
name = "german-hospitals"
version = "0.1.0"
description = "A data project looking at German hospitals from 2010 to today"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "kaleido>=1.3.0",
    "marimo>=0.23.6",
    "nbformat>=5.10.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "plotly-express>=0.4.1",
    "statsmodels>=0.14.6",
    "xlrd>=2.0.2",
]
